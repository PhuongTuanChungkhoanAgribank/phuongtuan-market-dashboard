name: Update Fund Portfolios

on:
  schedule:
    - cron: "0 7 * * 1"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:

concurrency:
  group: fund-portfolios
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-funds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect official fund data
        run: python scripts/fetch_funds.py
      - name: Commit weekly fund data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_fund_portfolios.json
          if git diff --cached --quiet; then
            echo "No weekly fund changes to commit."
          else
            git commit -m "chore: update weekly fund portfolios"
            git push
          fi
