name: Update Daily Market News

on:
  schedule:
    # 16:00 Vietnam time (UTC+7) every day.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and translate news
        run: python scripts/fetch_news.py

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: update daily market news"
            git push
          fi
