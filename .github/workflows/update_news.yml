name: Update Daily Market News

on:
  schedule:
    # GitHub Actions cron is UTC. Offset away from :00/:15/:30/:45
    # to reduce delays during peak scheduler load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: daily-market-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install news dependencies
        run: python -m pip install "feedparser<7.0,>=6.0" "requests<3.0,>=2.31" "beautifulsoup4<5.0,>=4.12"

      - name: Fetch and translate news
        run: python scripts/fetch_news.py

      - name: Commit updated news and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_news.json data/archive/
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: update daily market news"
            git pull --rebase origin main
            git push origin main
          fi
