name: Update Daily Market News

on:
  schedule:
    # 07:00, 11:00 and 15:00 Vietnam time (UTC+7) every day.
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and translate news
        run: python scripts/fetch_news.py

      - name: Commit updated news and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_news.json data/archive/
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: update daily market news"
            git push
          fi
